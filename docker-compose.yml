# Local development only: PostgreSQL + backend in containers.
# The frontend runs on your machine with `npm run dev` (fastest hot reload).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: localshop
      POSTGRES_PASSWORD: localshop
      POSTGRES_DB: localshop
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localshop -d localshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Inside Docker the database host is "db", not "localhost"
      DATABASE_URL: postgresql+psycopg://localshop:localshop@db:5432/localshop
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app   # live code reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
